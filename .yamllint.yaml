# yamllint config tuned for this repository's file types:
# - GitHub Actions workflows ("on:" key + no leading "---" by convention)
# - Kubernetes manifests and GoReleaser config
# - OpenAPI specs with inline flow mappings like `{ type: string }`
extends: default

rules:
  document-start: disable
  truthy:
    check-keys: false # GitHub Actions "on:" is not a boolean
  line-length:
    max: 120
  braces:
    max-spaces-inside: 1 # allow { type: string } in OpenAPI
  comments:
    min-spaces-from-content: 1
