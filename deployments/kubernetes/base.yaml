apiVersion: v1
kind: Namespace
metadata:
  name: golang-api-template
  labels:
    app.kubernetes.io/part-of: golang-api-template
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: golang-api-template-config
  namespace: golang-api-template
  labels:
    app.kubernetes.io/name: golang-api-template
data:
  # ── Application (this template owns these) ──────────────────────────────
  APP_NAME: "golang-api-template"
  APP_ENV: "production"
  APP_PORT: "8080"
  APP_SHUTDOWN_TIMEOUT: "25s"   # < terminationGracePeriodSeconds below
  # APP_CORS_ALLOWED_ORIGINS: "https://app.example.com"

  # ── Telemetry (hellnet-lib-telemetry owns these; never duplicated) ──────
  # Required in production: full logs/metrics/traces via OTLP.
  HELLNET_TELEMETRY_SERVICE: "golang-api-template"
  HELLNET_TELEMETRY_ENDPOINT: "http://alloy.monitoring.svc:4318"
  HELLNET_TELEMETRY_ENVIRONMENT: "Production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-api-template
  namespace: golang-api-template
  labels:
    app.kubernetes.io/name: golang-api-template
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # zero-downtime deploys rely on /ready gates
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golang-api-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golang-api-template
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/guilhermelinosp/golang-api-template:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: golang-api-template-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /live       # provided by hellnet-lib-telemetry
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /live       # telemetria: Live()
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready      # telemetria: Ready() (+ HealthRegister checks)
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: golang-api-template
  namespace: golang-api-template
  labels:
    app.kubernetes.io/name: golang-api-template
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: golang-api-template
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics           # dedicated scrape port for Prometheus Operator
      port: 8080
      targetPort: http
