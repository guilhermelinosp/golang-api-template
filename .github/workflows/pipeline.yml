name: pipeline

# Fully abstracted: every job is an import from templates.
# Triggered manually (workflow_dispatch) so a publish only happens on demand
# and never re-publishes an existing goreleaser tag:
#   release (semver tag + GH Release)
#     → go-quality (tidy/vet/race tests/build/lint/govulncheck; dep-review skips on dispatch)
#     → goreleaser-publish (binaries + checksums onto the tag's release)
#     → image (buildah → GHCR)

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions: write-all

jobs:
  release:
    uses: guilhermelinosp/templates/.github/workflows/release.yml@main
    secrets: inherit

  quality:
    needs: [release]
    uses: guilhermelinosp/templates/.github/workflows/go-quality.yml@main
    with:
      go-version-file: go.mod

  binaries:
    needs: [release]
    uses: guilhermelinosp/templates/.github/workflows/goreleaser-publish.yml@main
    permissions:
      contents: write

  image:
    needs: [quality, binaries]
    uses: guilhermelinosp/templates/.github/workflows/buildah.yml@main
